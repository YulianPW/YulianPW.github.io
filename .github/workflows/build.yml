name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install local media validation tools
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate local staff media
        run: node scripts/import-staff-media.mjs --check

      - name: Validate dormant tweet media manifest
        run: node scripts/refresh-tweet-media.mjs --check

      - name: Test local media source selection
        run: node --test scripts/tests/*.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Compute runtime versions
        run: |
          DATA_VERSION=$(git rev-parse --short HEAD)
          MEDIA_VERSION=$(git log -1 --format=%H -- assets/media/staff)
          test -n "${MEDIA_VERSION}"
          echo "DATA_VERSION=${DATA_VERSION}" >> "${GITHUB_ENV}"
          echo "MEDIA_VERSION=${MEDIA_VERSION}" >> "${GITHUB_ENV}"

      - name: Prepare static files
        run: |
          mkdir -p public
          rsync -av --exclude '.git*' --exclude '.github' ./ ./public

      - name: Generate version manifest
        working-directory: public
        run: |
          printf '{ "dataVersion": "%s", "mediaVersion": "%s" }\n' \
            "${DATA_VERSION}" "${MEDIA_VERSION}" > version.json
          cat version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
