      const MEDIA_GALLERY_VERSION = "2026073110";
      const MEDIA_SOURCE_PROFILE_URL =
        "https://twitter.com/intent/user?screen_name=yl_YuTang";
      const HOME_MEDIA_ORIGINS = Object.freeze([
        "https://pbs.twimg.com",
        "https://video.twimg.com",
      ]);
      const VISUAL_CACHE_ASSETS = ["assets/images/quan.png"];
      const VALID_TAGS = ["绿色陪", "女喘陪", "视频陪", "未进店"];
      const FEATURE_RULES = [
        {
          label: "音频定制",
          pattern: /音频定制|定制音频|录音定制|定制录音|成品录音|音频|录音/,
        },
        {
          label: "视频定制",
          pattern: /视频定制|定制视频|小视频定制|定制小视频|照片定制|定制照片|小视频|照片|图包/,
        },
        { label: "视频", pattern: /视频|露脸|摄像头|胸视|腿视|漏视/ },
        { label: "语聊", pattern: /语聊|连麦|哄睡|叫醒/ },
        {
          label: "游戏",
          pattern: /手游|端游|王者|金铲铲|lol|云顶|瓦|吃鸡|csgo|永劫/i,
        },
        { label: "Cos", pattern: /cos|jk|lo裙|汉服|旗袍|制服/i },
        { label: "虚恋", pattern: /虚恋|电子女友|恋人/ },
      ];
      let currentSortColumn = null;
      let currentSortDirection = null;
      let tableData = null;
      let lastRenderedDataJson = "";
      let homeGalleryModulePromise = null;
      let homeGalleryRefreshGeneration = 0;
      let homeMediaOriginsWarmed = false;

      function getSiteBaseUrl() {
        const { origin, pathname } = window.location;
        const normalizedPath = pathname.endsWith("/")
          ? pathname
          : pathname.endsWith("/index.html")
            ? pathname.replace(/index\.html$/, "")
            : `${pathname}/`;

        return new URL(normalizedPath, origin);
      }

      function buildRuntimeUrl(path) {
        return new URL(path, getSiteBaseUrl()).toString();
      }

      function readLocalCache(key) {
        try {
          return localStorage.getItem(key);
        } catch (_) {
          return null;
        }
      }

      function writeLocalCache(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      }

      function removeLocalCache(key) {
        try {
          localStorage.removeItem(key);
        } catch (_) {}
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getDataCacheKeys() {
        return {
          dataKey: `${DATA_CACHE_KEY_PREFIX}${DATA_VERSION}`,
          timeKey: `${DATA_CACHE_TIME_KEY_PREFIX}${DATA_VERSION}`,
        };
      }

      function getInfoCacheKey() {
        return `${INFO_CACHE_KEY_PREFIX}${INFO_VERSION}`;
      }

      // 提取 kp 价格
      function extractKpPrice(desc) {
        if (!desc) return null;
        // 支持格式：kp66/10分、kp60/10分、kp88/10、k66/10分 等
        const match = desc.match(/(?:^|[^a-zA-Z])k(?:p)?(\d+)\//);
        return match ? parseInt(match[1], 10) : null;
      }

      function getKpPrice(item) {
        const fieldPrice = Number.parseInt(item.kp, 10);
        if (Number.isFinite(fieldPrice)) return fieldPrice;
        return extractKpPrice(item.desc);
      }

      function getFeatureTags(desc, kpPrice) {
        const text = desc || "";
        const labels = FEATURE_RULES.filter((rule) => rule.pattern.test(text))
          .map((rule) => rule.label)
          .slice(0, 4);
        return kpPrice !== null ? ["KP", ...labels] : labels;
      }

      function prepareStaffItems(data) {
        return (data.staff || []).map((item, index) => {
          const kpPrice = getKpPrice(item);
          const features = getFeatureTags(item.desc, kpPrice);
          return {
            ...item,
            index,
            kpPrice,
            kpDisplay: kpPrice ? String(kpPrice) : "-",
            features,
            searchText: [
              item.name,
              item.tags,
              item.desc,
              kpPrice || "",
              features.join(" "),
            ].join(" "),
          };
        });
      }

      function init() {
        document.getElementById("tagSelect").value = "all";
        bindCardListActions();
        applyUrlState();
        syncSortControls();
        warmVisualCache();
        const hasCachedContent = renderLatestCachedTableData();
        if (!hasCachedContent) {
          document.getElementById("loading").style.display = "block";
        }
        loadVersion().finally(() => loadTableData(hasCachedContent));
      }

      function runWhenIdle(callback) {
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(callback, { timeout: 2500 });
          return;
        }
        setTimeout(callback, 1200);
      }

      function warmVisualCache() {
        runWhenIdle(() => {
          cleanupOldMobileBackgroundCaches();
          VISUAL_CACHE_ASSETS.forEach((assetPath) => {
            fetch(buildRuntimeUrl(assetPath), { cache: "force-cache" }).catch(
              () => {}
            );
          });

          if (window.matchMedia("(max-width: 640px)").matches) {
            cacheMobileBackground();
          }
        });
      }

      function cleanupOldMobileBackgroundCaches() {
        try {
          const keysToRemove = [];
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (
              key &&
              key.startsWith("rainlove_mobile_bg_") &&
              key !== MOBILE_BG_CACHE_KEY
            ) {
              keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(removeLocalCache);
        } catch (_) {}
      }

      function cacheMobileBackground() {
        if (readLocalCache(MOBILE_BG_CACHE_KEY)) return;

        fetch(buildRuntimeUrl(MOBILE_BG_URL), { cache: "force-cache" })
          .then((response) => (response.ok ? response.blob() : null))
          .then((blob) => {
            if (!blob || blob.size > 60000 || !window.FileReader) return;

            const reader = new FileReader();
            reader.onload = () => {
              const dataUrl = reader.result;
              if (typeof dataUrl !== "string") return;
              writeLocalCache(MOBILE_BG_CACHE_KEY, dataUrl);
              document.documentElement.style.setProperty(
                "--mobile-bg-image",
                `url("${dataUrl}")`
              );
            };
            reader.readAsDataURL(blob);
          })
          .catch(() => {});
      }

      async function loadVersion() {
        try {
          const response = await fetch(buildRuntimeUrl("version.json"), {
            cache: "no-store",
          });
          if (!response.ok) return; // 本地开发时 version.json 不存在，静默跳过
          const data = await response.json();
          if (data.dataVersion) {
            DATA_VERSION = data.dataVersion;
          }
        } catch (_) {
          // 本地开发时正常情况，不打印警告
        }
      }

      /**
       * 从已有版本缓存中选出最近一次有效数据，先于网络版本校验渲染正文。
       *
       * @description 版本号仍由 version.json 决定；这里的缓存只承担首屏快照，
       * 后续会按当前版本重新校验，且暂不启动 X 媒体请求。
       *
       * @returns {boolean} 是否已渲染可用的正文快照。
       */
      function renderLatestCachedTableData() {
        const now = Date.now();
        let latest = null;

        try {
          for (let index = 0; index < localStorage.length; index += 1) {
            const timeKey = localStorage.key(index);
            if (!timeKey?.startsWith(DATA_CACHE_TIME_KEY_PREFIX)) continue;

            const cachedTime = Number(readLocalCache(timeKey) || 0);
            if (
              !Number.isFinite(cachedTime) ||
              now - cachedTime >= DATA_CACHE_TTL ||
              cachedTime <= (latest?.cachedTime || 0)
            ) {
              continue;
            }

            const version = timeKey.slice(DATA_CACHE_TIME_KEY_PREFIX.length);
            const dataKey = `${DATA_CACHE_KEY_PREFIX}${version}`;
            const serializedData = readLocalCache(dataKey);
            if (!serializedData) continue;
            latest = { cachedTime, dataKey, timeKey, serializedData };
          }
        } catch (_) {
          return false;
        }

        if (!latest) return false;
        try {
          lastRenderedDataJson = latest.serializedData;
          renderTable(
            JSON.parse(latest.serializedData),
            Boolean(currentSortColumn),
            false,
          );
          return true;
        } catch (_) {
          lastRenderedDataJson = "";
          removeLocalCache(latest.dataKey);
          removeLocalCache(latest.timeKey);
          return false;
        }
      }

      // 动态加载说明内容
      function loadInfoContent() {
        const container = document.getElementById("info-container");
        if (container.innerHTML) {
          toggleInfo();
          return;
        }

        const cacheKey = getInfoCacheKey();
        const cachedHtml = readLocalCache(cacheKey);
        if (cachedHtml) {
          container.innerHTML = cachedHtml;
          toggleInfo();
          runWhenIdle(() =>
            fetchInfoContent(container, cacheKey, false).catch(() => {})
          );
          return;
        }

        document.getElementById("loading").style.display = "block";
        fetchInfoContent(container, cacheKey, true)
          .catch((err) => console.error(err))
          .finally(
            () => (document.getElementById("loading").style.display = "none"),
          );
      }

      function fetchInfoContent(container, cacheKey, shouldRender) {
        return fetch(
          buildRuntimeUrl(`assets/fragments/info-content.html?v=${INFO_VERSION}`),
          { cache: "default" }
        )
          .then((response) => {
            if (!response.ok) throw new Error("内容加载失败");
            return response.text();
          })
          .then((html) => {
            writeLocalCache(cacheKey, html);
            if (shouldRender) {
              container.innerHTML = html;
              toggleInfo();
            }
          });
      }

      // 数据加载函数
      function renderTable(data, applySort = true, initializeMedia = true) {
        tableData = data;
        let staff = prepareStaffItems(data);

        if (applySort && currentSortColumn && currentSortDirection) {
          staff.sort(compareStaff);
        }

        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = staff.map(renderStaffRow).join("");

        document.getElementById("cardList").innerHTML = staff
          .map(renderStaffCard)
          .join("");

        filterByTag();
        if (initializeMedia) scheduleHomeMediaGalleries();
      }

      function compareStaff(a, b) {
        let aVal, bVal;
        if (currentSortColumn === "kp") {
          aVal = a.kpPrice;
          bVal = b.kpPrice;
          if (aVal === null && bVal === null) return 0;
          if (aVal === null) return 1;
          if (bVal === null) return -1;
        } else {
          aVal = a[currentSortColumn];
          bVal = b[currentSortColumn];
        }

        if (currentSortDirection === "asc") {
          return aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
        }
        return aVal < bVal ? 1 : aVal > bVal ? -1 : 0;
      }

      function renderStaffRow(item) {
        const socialIcon = getSocialIcon(item.social);
        const tweetShowcase = renderTweetShowcase(item);
        return `
                <tr class="staff-item staff-row ${getTagClass(item.tags)}" data-tags="${escapeHtml(item.tags)}" data-search="${escapeHtml(item.searchText)}" data-kp="${item.kpPrice || ""}">
                    <td>
                        <div class="name-cell">
                            <div class="name-text">${escapeHtml(item.name)}</div>
                            <div class="social-links compact">
                                ${socialIcon}
                            </div>
                        </div>
                    </td>
                    <td class="kp-cell"><span class="kp-text">${item.kpDisplay}</span></td>
                    <td>
                      <span class="desc-text">${escapeHtml(item.desc)}</span>
                      ${renderFeatureChips(item.features)}
                    </td>
                </tr>
                ${
                  tweetShowcase
                    ? `<tr class="staff-item staff-media-row" data-tags="${escapeHtml(item.tags)}" data-search="${escapeHtml(item.searchText)}">
                        <td colspan="3">${tweetShowcase}</td>
                      </tr>`
                    : ""
                }
            `;
      }

      function renderStaffCard(item) {
        const socialIcon = getSocialIcon(item.social);
        return `
                <article id="staff-${item.index}" class="staff-item staff-card ${getTagClass(item.tags)}" data-tags="${escapeHtml(item.tags)}" data-search="${escapeHtml(item.searchText)}" data-kp="${item.kpPrice || ""}">
                  <div class="card-header">
                    <div class="card-title">
                      <h2 class="card-name">${escapeHtml(item.name)}</h2>
                      ${socialIcon}
                      ${renderTagBadge(item.tags)}
                    </div>
                    <div class="card-price">KP<strong>${item.kpDisplay}</strong></div>
                  </div>
                  <div class="card-meta">
                    ${renderFeatureChips(item.features)}
                  </div>
                  <div class="card-desc-toggle" role="button" tabindex="0" aria-expanded="false" aria-label="展开完整介绍">
                    <p class="card-desc">${escapeHtml(item.desc)}</p>
                    <span class="desc-toggle-hint">展开</span>
                  </div>
                  ${renderTweetShowcase(item)}
                </article>
            `;
      }

      function getSafeUrl(value, allowedHosts) {
        try {
          const url = new URL(value);
          const hostname = url.hostname.toLowerCase().replace(/^www\./, "");
          if (url.protocol !== "https:" || !allowedHosts.includes(hostname)) {
            return "";
          }
          return url.toString();
        } catch (_) {
          return "";
        }
      }

      function getTweetMedia(item) {
        const tweetUrl = getSafeUrl(item.tweet, ["x.com", "twitter.com"]);
        if (!tweetUrl) return null;
        return { tweetUrl, sourceUrl: MEDIA_SOURCE_PROFILE_URL };
      }

      function renderTweetShowcase(item) {
        const media = getTweetMedia(item);
        if (!media) return "";

        const label = `${item.name} 的动态媒体画廊`;

        return `
          <section class="tweet-showcase" aria-label="${escapeHtml(label)}">
            <div class="tweet-showcase-header">
              <span class="tweet-showcase-hint">图片可放大 · 视频可播放</span>
              <a
                class="tweet-source-link"
                href="${escapeHtml(media.tweetUrl)}"
                target="_blank"
                rel="noreferrer"
              >原推文 ↗</a>
            </div>
            <template class="tweet-connection-source-template">
              <a
                class="tweet-profile-link"
                href="${escapeHtml(media.sourceUrl)}"
                target="_blank"
                rel="noreferrer"
                aria-label="打开来源 X 主页"
              >
                ${getSvgIcon("twitter")}
                <span>twi</span>
              </a>
              <span class="tweet-network-note">需开🪜</span>
            </template>
            <div
              class="tweet-gallery-host"
              data-tweet-url="${escapeHtml(media.tweetUrl)}"
              data-state="waiting"
              role="status"
              aria-live="polite"
              aria-label="${escapeHtml(item.name)}的媒体准备中"
            >
              <span class="tweet-gallery-loader" aria-hidden="true"></span>
              <span class="tweet-gallery-status">接近这里自动预载</span>
            </div>
          </section>
        `;
      }

      function renderFeatureChips(features) {
        if (!features.length) return "";
        return `<div class="feature-chips">${features
          .map((feature) => `<span class="feature-chip">${feature}</span>`)
          .join("")}</div>`;
      }

      function renderTagBadge(tags) {
        return `<span class="tag-badge ${getTagClass(tags)}-badge">${escapeHtml(tags)}</span>`;
      }

      // 排序函数
      function sortTable(column) {
        if (currentSortColumn === column) {
          currentSortDirection =
            currentSortDirection === "asc" ? "desc" : "asc";
        } else {
          currentSortColumn = column;
          currentSortDirection = "asc";
        }

        syncSortControls();

        if (tableData) {
          renderTable(tableData, true);
        }
      }

      function syncSortControls() {
        document.querySelectorAll("th.sortable").forEach((header) => {
          header.classList.remove("sort-asc", "sort-desc");
        });
        const th = currentSortColumn
          ? document.querySelector(`th[data-sort="${currentSortColumn}"]`)
          : null;
        if (th && currentSortDirection) {
          th.classList.add(`sort-${currentSortDirection}`);
        }
      }

      function loadTableData(hasRenderedContent = Boolean(tableData)) {
        if (!hasRenderedContent) {
          document.getElementById("loading").style.display = "block";
        }
        const { dataKey, timeKey } = getDataCacheKeys();
        const cached = readLocalCache(dataKey);
        const cachedTime = Number(readLocalCache(timeKey) || 0);
        const now = Date.now();

        if (cached && now - cachedTime < DATA_CACHE_TTL) {
          try {
            const cachedData = JSON.parse(cached);
            if (cached !== lastRenderedDataJson) {
              lastRenderedDataJson = cached;
              renderTable(cachedData, Boolean(currentSortColumn));
            } else {
              scheduleHomeMediaGalleries();
            }
            document.getElementById("loading").style.display = "none";
            runWhenIdle(() =>
              fetchTableData(dataKey, timeKey, false).catch(() => {})
            );
            return;
          } catch (_) {
            removeLocalCache(dataKey);
            removeLocalCache(timeKey);
          }
        }

        fetchTableData(dataKey, timeKey, true)
          .catch((error) => {
            if (!tableData) {
              console.error("数据加载失败:", error);
            } else {
              scheduleHomeMediaGalleries();
            }
          })
          .finally(
            () => (document.getElementById("loading").style.display = "none"),
          );
      }

      function fetchTableData(dataKey, timeKey, shouldRender) {
        return fetch(buildRuntimeUrl(`assets/data/data.json?v=${DATA_VERSION}`), {
          cache: "default",
        })
          .then((response) => {
            if (!response.ok) throw new Error("网络响应异常");
            return response.json();
          })
          .then((data) => {
            const serializedData = JSON.stringify(data);
            writeLocalCache(dataKey, serializedData);
            writeLocalCache(timeKey, String(Date.now()));
            if (shouldRender) {
              if (serializedData !== lastRenderedDataJson) {
                lastRenderedDataJson = serializedData;
                renderTable(data, Boolean(currentSortColumn));
              } else {
                scheduleHomeMediaGalleries();
              }
            }
          });
      }

      // 统一筛选函数
      function filterByTag() {
        const selectedTag = document.getElementById("tagSelect").value;
        const keyword = document
          .getElementById("keywordInput")
          .value.trim()
          .toUpperCase();
        let matched = 0;

        document.querySelectorAll(".staff-item").forEach((item) => {
          const matchTag =
            selectedTag === "all" || item.dataset.tags.includes(selectedTag);
          const matchKeyword =
            !keyword || item.dataset.search.toUpperCase().includes(keyword);
          const isMatch = matchTag && matchKeyword;

          item.hidden = !isMatch;
          if (!isMatch) {
            item.querySelectorAll("video").forEach((video) => video.pause());
          }
          if (isMatch && item.classList.contains("staff-row")) matched += 1;
        });

        updateResultSummary(matched);
      }

      function updateResultSummary(matched) {
        const total = document.querySelectorAll(".staff-row").length;
        const noResults = document.getElementById("noResults");
        noResults.hidden = !total || matched > 0;
      }

      function applyUrlState() {
        const params = new URLSearchParams(window.location.search);
        const tag = params.get("tag");
        const keyword = params.get("q");
        const sort = params.get("sort");
        const direction = params.get("dir");

        if (tag && VALID_TAGS.includes(tag)) {
          document.getElementById("tagSelect").value = tag;
        }
        if (keyword) {
          document.getElementById("keywordInput").value = keyword;
        }
        if (sort === "kp" && ["asc", "desc"].includes(direction)) {
          currentSortColumn = sort;
          currentSortDirection = direction;
        }
      }

      // 转换 Twitter 链接为 Intent API
      function convertTwitterUrl(url) {
        if (url && url.includes("twitter://user?screen_name=")) {
          const screenName = getTwitterScreenName(url);
          if (screenName) {
            return `https://twitter.com/intent/user?screen_name=${encodeURIComponent(screenName)}`;
          }
        }
        return url;
      }

      function getTwitterScreenName(url) {
        const screenName = url?.match(/screen_name=([^&]+)/)?.[1] || "";
        return screenName.replace(/[^A-Za-z0-9_]/g, "");
      }

      // 打开 Twitter Intent（移动端优先打开应用，失败则打开网页）
      function openTwitterWithIntent(screenName) {
        if (!screenName) return;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const encodedName = encodeURIComponent(screenName);
        const intentUrl = `https://twitter.com/intent/user?screen_name=${encodedName}`;

        if (isMobile) {
          // 移动端：先尝试打开应用
          window.location.href = `twitter://user?screen_name=${encodedName}`;
          // 如果应用未安装，500ms 后打开网页
          setTimeout(() => {
            window.location.href = intentUrl;
          }, 500);
        } else {
          // 桌面端：直接打开 Intent API
          window.open(intentUrl, "_blank");
        }
      }

      // 获取社交媒体图标
      function getSocialIcon(url) {
        if (!url) return "";
        const platformMap = {
          snssdk1128: {
            class: "douyin-icon",
            icon: "douyin",
            text: "dy",
            title: "抖音主页",
          },
          twitter: {
            class: "twitter-icon",
            icon: "twitter",
            text: "twi",
            title: "Twitter主页",
          },
        };

        const platform = Object.keys(platformMap).find((key) =>
          url.includes(key),
        );
        const config = platformMap[platform] || {};

        if (!config.class) return "";

        let finalUrl = url;
        let onClick = "";
        if (platform === "twitter") {
          const screenName = getTwitterScreenName(url);
          if (!screenName) return "";
          finalUrl = convertTwitterUrl(url);
          onClick = `onclick="openTwitterWithIntent('${screenName}'); return false;"`;
        }

        return `
                <a href="${escapeHtml(finalUrl)}"
                   class="social-icon ${config.class}"
                   target="_blank"
                   ${onClick}
                   title="${escapeHtml(config.title)}">
                   ${getSvgIcon(config.icon)}
                   <span class="social-text">${config.text}</span>
                </a>
            `;
      }

      // 获取标签样式类
      function getTagClass(tags) {
        const tagClasses = {
          绿色陪: "green",
          女喘陪: "audio",
          视频陪: "video",
          未进店: "unjoined",
        };
        return tagClasses[tags] || "";
      }

      function getSvgIcon(name) {
        const icons = {
          twitter: `
                    <span class="icon icon-twitter" aria-hidden="true">
                        <svg viewBox="0 0 512 512">
                            <use href="#icon-twitter" />
                        </svg>
                    </span>
                `,
          douyin: `
                    <span class="icon icon-douyin" aria-hidden="true">
                        <svg viewBox="0 0 1024 1024">
                            <use href="#icon-douyin" />
                        </svg>
                    </span>
                `,
        };
        return icons[name] || "";
      }

      // 修改后的切换函数
      function toggleInfo() {
        const info = document.querySelector(".info");
        if (info) {
          info.style.display =
            info.style.display === "block" ? "none" : "block";
        }
      }

      // DOM 就绪即开始正文加载，不等待图片等非关键资源完成。
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init, { once: true });
      } else {
        init();
      }

      function bindCardListActions() {
        const cardList = document.getElementById("cardList");
        cardList.addEventListener("click", handleCardDescClick);
        cardList.addEventListener("keydown", handleCardDescKeydown);
      }

      /**
       * 在画廊模块延迟加载期间并行建立 X 媒体 CDN 连接。
       *
       * @description 正文已经生成后才注入 preconnect，既不阻塞首轮内容渲染，
       * 又让图片、视频请求无需等到画廊模块执行时才开始握手。
       *
       * @returns {void}
       */
      function warmHomeMediaOrigins() {
        if (homeMediaOriginsWarmed) return;
        homeMediaOriginsWarmed = true;

        HOME_MEDIA_ORIGINS.forEach((origin) => {
          const link = document.createElement("link");
          link.rel = "preconnect";
          link.href = origin;
          document.head.appendChild(link);
        });
      }

      /**
       * 让正文至少完成一帧绘制后，再导入并扫描 X 媒体画廊。
       *
       * @description 生成号会取消快速排序或数据刷新留下的旧任务，避免扫描已经
       * 被替换的占位节点。
       *
       * @returns {void}
       */
      function scheduleHomeMediaGalleries() {
        const generation = ++homeGalleryRefreshGeneration;
        warmHomeMediaOrigins();
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(() => {
            window.setTimeout(() => {
              if (generation !== homeGalleryRefreshGeneration) return;
              initializeHomeMediaGalleries();
            }, 0);
          });
        });
      }

      /**
       * 加载首页画廊适配器，并扫描本轮渲染产生的媒体占位区。
       *
       * @description 模块 Promise 在排序和筛选导致的重复渲染之间复用，避免重复下载代码；
       * 具体的可见性观察、请求去重和播放器交互由独立模块负责。
       *
       * @returns {void}
       */
      function initializeHomeMediaGalleries() {
        if (!homeGalleryModulePromise) {
          homeGalleryModulePromise = import(
            buildRuntimeUrl(
              `assets/x-embed-preview/scripts/home-gallery.js?v=${MEDIA_GALLERY_VERSION}`,
            )
          );
        }

        homeGalleryModulePromise
          .then(({ refreshHomeMediaGalleries }) => {
            refreshHomeMediaGalleries(document);
          })
          .catch(() => {
            document
              .querySelectorAll(".tweet-gallery-host[data-state='waiting']")
              .forEach((mount) => {
                mount.dataset.state = "error";
                const status = mount.querySelector(".tweet-gallery-status");
                if (status) status.textContent = "连接 X 失败，请刷新重试";
              });
          });
      }

      function handleCardDescClick(event) {
        const target = event.target.closest(".card-desc-toggle");
        if (!target || !event.currentTarget.contains(target)) return;
        toggleCardDesc(target);
      }

      function handleCardDescKeydown(event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        const target = event.target.closest(".card-desc-toggle");
        if (!target || !event.currentTarget.contains(target)) return;
        event.preventDefault();
        toggleCardDesc(target);
      }

      function toggleCardDesc(target) {
        const card = target.closest(".staff-card");
        if (!card) return;
        const isExpanded = card.classList.toggle("expanded");
        target.setAttribute("aria-expanded", String(isExpanded));
        target.setAttribute(
          "aria-label",
          isExpanded ? "收起完整介绍" : "展开完整介绍"
        );
        const hint = target.querySelector(".desc-toggle-hint");
        if (hint) {
          hint.textContent = isExpanded ? "收起" : "展开";
        }
      }

      function copyPageUrl() {
        copyText(window.location.href, "网页链接已复制到剪贴板");
      }

      function copyText(text, successMessage) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(() => alert(successMessage))
            .catch(() => fallbackCopy(text, successMessage));
        } else {
          fallbackCopy(text, successMessage);
        }
      }

      function fallbackCopy(text, successMessage) {
        const input = document.createElement("textarea");
        input.value = text;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.left = "-9999px";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        document.body.removeChild(input);
        alert(successMessage);
      }
    </script>
  </body>
</html>
